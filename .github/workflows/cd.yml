name: Continuous Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy-production:
    name: Build & Deploy Production Images
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub / Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-surplus-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-surplus-backend:${{ github.ref_name }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/food-surplus-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/food-surplus-frontend:${{ github.ref_name }}
