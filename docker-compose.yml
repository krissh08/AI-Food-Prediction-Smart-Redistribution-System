version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: food_surplus_db
    restart: always
    environment:
      POSTGRES_DB: food_surplus_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: food_surplus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres_secure_password_2026@db:5432/food_surplus_db
      JWT_SECRET: super_secret_devops_food_surplus_key_2026
      ALGORITHM: HS256
      FRONTEND_URL: http://localhost
      BACKEND_URL: http://localhost:8000
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: ${SMTP_USERNAME:-nourishsync@gmail.com}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-nourishsync@gmail.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nourishsync.org}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - document_uploads:/app/uploads/documents
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: food_surplus_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  document_uploads:
